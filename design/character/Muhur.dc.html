<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C8A951; } a:hover { color: #8A6A1F; }
    .eyebrow { font-family: Cinzel, Georgia, serif; font-weight: 600; font-size: 13px; letter-spacing: 1.6px; color: #A89878; text-transform: uppercase; }
    .rule { flex-grow: 1; height: 1px; background: rgba(74,61,44,0.75); }
    .card { background: #1E1811; border: 1px solid rgba(74,61,44,0.55); border-radius: 7px;
            background-image: radial-gradient(rgba(232,223,200,0.05) 0.5px, transparent 0.6px), radial-gradient(rgba(232,223,200,0.04) 0.5px, transparent 0.6px);
            background-size: 23px 19px, 31px 27px; background-position: 0 0, 11px 9px; }
    .num { font-family: Cinzel, Georgia, serif; font-variant-numeric: tabular-nums; }
    .radarLabel { font-family: Cinzel, Georgia, serif; font-weight: 600; }
  </style>
</helmet>

<div style="width: 390px; background: #14100C; color: #E8DFC8; font-family: 'EB Garamond', Georgia, serif; padding-bottom: 32px;">

  <div style="display: flex; align-items: center; height: 56px; padding: 0 16px;">
    <div style="font-family: Cinzel, Georgia, serif; font-weight: 600; font-size: 22px; letter-spacing: 0.3px; color: #C8A951;">Karakter</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; padding-top: 8px;">

    <svg width="220" height="220" viewBox="0 0 200 200" fill="none">
      <circle cx="100" cy="100" r="92" stroke="#2B2218" stroke-width="3"/>
      <circle cx="100" cy="100" r="92" stroke="#C8A951" stroke-width="3" stroke-linecap="round"
              stroke-dasharray="265.9 578.1" transform="rotate(-90 100 100)"/>

      <g stroke-width="2" stroke-linecap="round">
        <g transform="rotate(0 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#C8A951"/></g>
        <g transform="rotate(18 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#C8A951"/></g>
        <g transform="rotate(36 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#C8A951"/></g>
        <g transform="rotate(54 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#C8A951"/></g>
        <g transform="rotate(72 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#C8A951"/></g>
        <g transform="rotate(90 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#C8A951"/></g>
        <g transform="rotate(108 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#C8A951"/></g>
        <g transform="rotate(126 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>
        <g transform="rotate(144 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>
        <g transform="rotate(162 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>
        <g transform="rotate(180 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>
        <g transform="rotate(198 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>
        <g transform="rotate(216 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>

        <g transform="rotate(252 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>
        <g transform="rotate(270 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>
        <g transform="rotate(288 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>
        <g transform="rotate(306 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>
        <g transform="rotate(324 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>
        <g transform="rotate(342 100 100)"><line x1="100" y1="14" x2="100" y2="22" stroke="#4A3D2C"/></g>
      </g>

      <circle cx="100" cy="100" r="64" fill="rgba(200,169,81,0.05)" stroke="#4A3D2C" stroke-width="1"/>
      <circle cx="100" cy="100" r="58" stroke="#8A6A1F" stroke-width="1" stroke-dasharray="2 6"/>

      <text x="100" y="80" text-anchor="middle" class="radarLabel" font-size="9" letter-spacing="2" fill="#A89878">SEVİYE</text>
      <text x="100" y="122" text-anchor="middle" class="num" font-weight="700" font-size="54" fill="#C8A951">7</text>
    </svg>

    <div class="num" style="font-family: 'EB Garamond', Georgia, serif; font-size: 13px; line-height: 18px; color: #A89878; margin-top: 4px;">1.240 / 2.700 XP</div>
    <div class="num" style="font-family: 'EB Garamond', Georgia, serif; font-size: 13px; line-height: 18px; color: #A89878;">Toplam 18.450 XP</div>

    <svg width="330" height="253" viewBox="0 0 300 230" fill="none" style="margin-top: 4px;">
      <polygon points="150,34 217.5,73 217.5,151 150,190 82.5,151 82.5,73" stroke="#2B2218" stroke-width="1"/>
      <polygon points="150,73 183.8,92.5 183.8,131.5 150,151 116.2,131.5 116.2,92.5" stroke="#2B2218" stroke-width="1"/>
      <g stroke="#2B2218" stroke-width="1">
        <line x1="150" y1="112" x2="150" y2="34"/>
        <line x1="150" y1="112" x2="217.5" y2="73"/>
        <line x1="150" y1="112" x2="217.5" y2="151"/>
        <line x1="150" y1="112" x2="150" y2="190"/>
        <line x1="150" y1="112" x2="82.5" y2="151"/>
        <line x1="150" y1="112" x2="82.5" y2="73"/>
      </g>

      <polygon points="150,72.4 167.7,101.8 178.8,128.6 150,164.4 126.8,125.4 137.8,105"
               fill="rgba(200,169,81,0.16)" stroke="#C8A951" stroke-width="1.5" stroke-linejoin="round"/>

      <circle cx="150" cy="72.4" r="3.5" fill="#C1443A"/>
      <circle cx="167.7" cy="101.8" r="3.5" fill="#6E8F6B"/>
      <circle cx="178.8" cy="128.6" r="3.5" fill="#8C5A3C"/>
      <circle cx="150" cy="164.4" r="3.5" fill="#5B8FA8"/>
      <circle cx="126.8" cy="125.4" r="3.5" fill="#7B5EA7"/>
      <circle cx="137.8" cy="105" r="3.5" fill="#C8A951"/>

      <text x="150" y="16" text-anchor="middle"><tspan class="radarLabel" font-size="10" letter-spacing="1.2" fill="#C1443A">GÜÇ </tspan><tspan class="num" font-weight="700" font-size="17" fill="#E8DFC8">14</tspan><tspan class="num" font-size="11" fill="#C1443A"> +2</tspan></text>
      <text x="236.6" y="66" text-anchor="start"><tspan class="radarLabel" font-size="10" letter-spacing="1.2" fill="#6E8F6B">ÇEV </tspan><tspan class="num" font-weight="700" font-size="17" fill="#E8DFC8">11</tspan><tspan class="num" font-size="11" fill="#6E8F6B"> +0</tspan></text>
      <text x="236.6" y="166" text-anchor="start"><tspan class="radarLabel" font-size="10" letter-spacing="1.2" fill="#8C5A3C">DAY </tspan><tspan class="num" font-weight="700" font-size="17" fill="#E8DFC8">13</tspan><tspan class="num" font-size="11" fill="#8C5A3C"> +1</tspan></text>
      <text x="150" y="216" text-anchor="middle"><tspan class="radarLabel" font-size="10" letter-spacing="1.2" fill="#5B8FA8">ZEK </tspan><tspan class="num" font-weight="700" font-size="17" fill="#E8DFC8">16</tspan><tspan class="num" font-size="11" fill="#5B8FA8"> +3</tspan></text>
      <text x="63.4" y="166" text-anchor="end"><tspan class="radarLabel" font-size="10" letter-spacing="1.2" fill="#7B5EA7">BİL </tspan><tspan class="num" font-weight="700" font-size="17" fill="#E8DFC8">12</tspan><tspan class="num" font-size="11" fill="#7B5EA7"> +1</tspan></text>
      <text x="63.4" y="66" text-anchor="end"><tspan class="radarLabel" font-size="10" letter-spacing="1.2" fill="#C8A951">KAR </tspan><tspan class="num" font-weight="700" font-size="17" fill="#E8DFC8">10</tspan><tspan class="num" font-size="11" fill="#C8A951"> +0</tspan></text>
    </svg>

  </div>

  <div style="padding: 8px 16px 0;">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 16px; border-radius: 7px; background: rgba(200,169,81,0.10); border: 1px solid rgba(200,169,81,0.45);">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="#C8A951" style="flex-shrink: 0;"><path d="M8 1.5l1.8 4.7L14.5 8l-4.7 1.8L8 14.5l-1.8-4.7L1.5 8l4.7-1.8z"/></svg>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
        <div style="font-family: 'EB Garamond', Georgia, serif; font-weight: 600; font-size: 17px; line-height: 24px; color: #E8DFC8;">1 yetenek hakkın var</div>
        <div style="font-size: 13px; line-height: 18px; color: #A89878;">Seçmek için dokun</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#C8A951" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M6 3l5 5-5 5"/></svg>
    </div>
  </div>

  <div style="padding: 24px 16px 0; display: flex; align-items: center; gap: 12px;">
    <div class="eyebrow">Bu hafta</div>
    <div class="rule"></div>
  </div>

  <div style="padding: 16px 16px 0;">
    <div class="card" style="padding: 16px;">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div class="num" style="font-weight: 700; font-size: 28px; line-height: 1; color: #C8A951;">640 XP</div>
          <div style="font-size: 13px; line-height: 18px; color: #A89878;">9 görev · en çok <span style="color: #5B8FA8;">Zeka</span></div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="#C8A951"><path d="M8 1.5S4.5 5 4.5 8.5a3.5 3.5 0 0 0 7 0c0-1.3-.6-2.4-1.3-3.2C9.6 6.6 9 7 9 7s.5-3.5-1-5.5z"/></svg>
          <div class="num" style="font-weight: 700; font-size: 24px; line-height: 1; color: #C8A951;">12</div>
        </div>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 6px; height: 72px; margin-top: 16px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 29px; border-radius: 2px; background: #8A6A1F;"></div><span style="font-size: 11px; color: #A89878;">Pt</span></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 51px; border-radius: 2px; background: #C8A951;"></div><span style="font-size: 11px; color: #A89878;">Sa</span></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 2px; border-radius: 2px; background: #2B2218;"></div><span style="font-size: 11px; color: #A89878;">Ça</span></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 22px; border-radius: 2px; background: #8A6A1F;"></div><span style="font-size: 11px; color: #A89878;">Pe</span></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 66px; border-radius: 2px; background: #C8A951;"></div><span style="font-size: 11px; color: #A89878;">Cu</span></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 34px; border-radius: 2px; background: #8A6A1F;"></div><span style="font-size: 11px; color: #A89878;">Ct</span></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 100%; height: 26px; border-radius: 2px; background: #8A6A1F;"></div><span style="font-size: 11px; color: #A89878;">Pz</span></div>
      </div>
    </div>
  </div>

  <div style="padding: 24px 16px 0; display: flex; align-items: center; gap: 12px;">
    <div class="eyebrow">Kazanılan yetenekler</div>
    <div class="rule"></div>
  </div>

  <div style="padding: 16px 16px 0; display: flex; flex-wrap: wrap; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px 8px 10px; border-radius: 22px; background: #1E1811; border: 1px solid #8A6A1F;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#C8A951" stroke-width="1.3"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.6"/><circle cx="8" cy="8" r="0.6" fill="#C8A951"/></svg>
      <span style="font-family: Cinzel, Georgia, serif; font-weight: 600; font-size: 14px; color: #E8DFC8;">Uzman</span>
      <span style="font-size: 11px; color: #5B8FA8;">Zeka</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px 8px 10px; border-radius: 22px; background: #1E1811; border: 1px solid #8A6A1F;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#C8A951" stroke-width="1.3" stroke-linecap="round"><path d="M2 12h12M5 12a3 3 0 0 1 6 0"/><path d="M8 2.5v2M3.9 4.4l1.4 1.4M12.1 4.4l-1.4 1.4"/></svg>
